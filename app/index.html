<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download JAMBIXO</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0b1f17;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      text-align:center;
      padding:20px;
    }

    .container{
      max-width:500px;
    }

    h1{
      font-size:3rem;
      color:#00ff99;
      margin-bottom:15px;
    }

    p{
      font-size:1.1rem;
      line-height:1.7;
      color:#d7d7d7;
      margin-bottom:35px;
    }

    .download-btn{
      display:inline-block;
      background:#00ff99;
      color:#071a12;
      text-decoration:none;
      padding:18px 40px;
      border-radius:50px;
      font-size:1.1rem;
      font-weight:bold;
      transition:0.3s;
    }

    .download-btn:hover{
      transform:scale(1.05);
      background:white;
    }

  </style>

</head>
<body>

  <div class="container">

    <h1>JAMBIXO</h1>

    <p>
      Click the button below to download the app and start practicing JAMB CBT questions for FREE.
    </p>

    <a href="https://play.google.com/store/apps/details?id=com.cbt.jambixo"
       target="_blank"
       class="download-btn">
       Download Now
    </a>

  </div>

  <script>

    fetch("https://trac-qkti.onrender.com/track", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        website: window.location.hostname,

        page: window.location.pathname

      })

    })
    .then(response => response.json())
    .then(data => console.log("Tracked:", data))
    .catch(error => console.log(error));

  </script>

</body>
</html>
